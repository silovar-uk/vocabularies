name: Validate vocabulary data

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/validate-data.mjs"
      - "scripts/validate-intake.mjs"
      - "editorial.js"
      - "editorial-protection.js"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate-data.mjs"
      - "scripts/validate-intake.mjs"
      - "editorial.js"
      - "editorial-protection.js"
      - ".github/workflows/validate-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate vocabulary data
        run: node scripts/validate-data.mjs

      - name: Validate editorial intake
        run: node scripts/validate-intake.mjs

      - name: Check editorial scripts
        run: |
          node --check editorial.js
          node --check editorial-protection.js
