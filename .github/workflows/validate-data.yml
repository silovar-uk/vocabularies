name: Validate vocabulary data

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/validate-data.mjs"
      - "scripts/validate-intake.mjs"
      - "app-v2.js"
      - "reader.js"
      - "search-v2.js"
      - "random-study.js"
      - "discovery.js"
      - "concept-map.js"
      - "semantic-index.js"
      - "knowledge-landscape.css"
      - "editorial.js"
      - "editorial-protection.js"
      - ".github/workflows/validate-data.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate-data.mjs"
      - "scripts/validate-intake.mjs"
      - "app-v2.js"
      - "reader.js"
      - "search-v2.js"
      - "random-study.js"
      - "discovery.js"
      - "concept-map.js"
      - "semantic-index.js"
      - "knowledge-landscape.css"
      - "editorial.js"
      - "editorial-protection.js"
      - ".github/workflows/validate-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate vocabulary data
        run: node scripts/validate-data.mjs

      - name: Validate editorial intake
        run: node scripts/validate-intake.mjs

      - name: Check public scripts
        run: |
          node --check app-v2.js
          node --check reader.js
          node --check search-v2.js
          node --check random-study.js
          node --check discovery.js
          node --check concept-map.js
          node --check semantic-index.js

      - name: Check editorial scripts
        run: |
          node --check editorial.js
          node --check editorial-protection.js