  <main class="map-shell">
    <section class="map-hero"><p class="map-eyebrow">CONCEPT MAP</p><h1>言葉ではなく、<br>言葉の「あいだ」を読む。</h1><p class="map-lead">似ている、区別する、広げる、支える。概念同士の関係を動詞で辿る。</p></section>

    <section class="verb-index" aria-labelledby="verbTitle">
